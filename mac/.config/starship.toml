add_newline = true
command_timeout = 200
# Apple logo in a rounded pill, drawn across two cells (U+E1BB U+E1BC) from the
# Herdr fonts (mac/.config/herdr/fonts/build-fonts). App terminals that can't
# load those fonts set STARSHIP_LOGO in .zshrc to the system logo instead.
format = "[\ue0b6](#333336)[${env_var.STARSHIP_LOGO}](fg:#FFFFFF bg:#333336)[\ue0b4](#333336) [$directory$git_branch$git_status]($style)$character"

[env_var.STARSHIP_LOGO]
default = "\ue1bb\ue1bc"
format = "$env_value"

[character]
error_symbol = "[✗](bold green)"
success_symbol = "[❯](bold green)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
