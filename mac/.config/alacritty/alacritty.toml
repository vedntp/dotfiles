# Alacritty config for macOS: the quick-fix terminal. AeroSpace alt-enter
# (shell) and alt-a (Claude Code) open a window here on the current workspace.
# Herdr also runs in Alacritty, so these looks apply to it too.

[general]
# alacritty.local.toml (ignored by Git) holds the font size, which changes per monitor.
import = ["~/.config/alacritty/themes/carbonfox.toml", "~/.config/alacritty/alacritty.local.toml"]

[env]
TERM = "xterm-256color"

# Start zsh directly (as a login shell) instead of through /usr/bin/login,
# which prints "Last login: ..." at the top of every window.
[terminal.shell]
program = "/bin/zsh"
args = ["-l"]

[font.normal]
family = "JetBrains Mono Herdr XL"
style = "Light"

[font.bold]
family = "JetBrains Mono Herdr XL"
style = "Regular"

[font.italic]
family = "JetBrains Mono Herdr XL"
style = "Light Italic"

[font.bold_italic]
family = "JetBrains Mono Herdr XL"
style = "Italic"

# Overrides on top of carbonfox. The background sits between the Ink ramp
# steps (#141618 #1a1d1f darker, #212427+ lighter) so the black logo pill and
# the first folder segments read as dark chips on a soft charcoal.
[colors.primary]
background = "#1e2124"

# Cursor in the prompt chevron's blue.
[colors.cursor]
text = "#1e2124"
cursor = "#78a9ff"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 600
unfocused_hollow = true

[window]
# Fully opaque: on a near-black theme, see-through wallpaper reads as smudges.
opacity = 1.0
blur = false
decorations = "Buttonless"
dynamic_padding = true
option_as_alt = "Both"

[window.padding]
x = 18
y = 16

#[window.dimensions]
#columns = 120
#lines = 25

# Both Option keys send escape sequences (Meta); Alt+Backspace deletes the previous word.
[keyboard]
bindings = [
  { key = "Back", mods = "Alt", chars = "\u001b\u007f" },
  { key = "PageUp", mods = "Control", chars = "\u0002P" },
  { key = "PageDown", mods = "Control", chars = "\u0002N" },
  # Ctrl+` toggles between the first Herdr space on Local and on omarchy (prefix+m).
  # Ctrl+Shift+` still hops to the previous space (prefix+P).
  { key = "`", mods = "Control", chars = "\u0002m" },
  { key = "`", mods = "Control|Shift", chars = "\u0002P" },
  { key = "~", mods = "Control|Shift", chars = "\u0002P" },
  { key = "T", mods = "Command", action = "ReceiveChar" },
  { key = "T", mods = "Command|Shift", action = "ReceiveChar" },
  { key = "Z", mods = "Command", action = "ReceiveChar" },
  { key = "H", mods = "Command|Shift", action = "ReceiveChar" },
  { key = "J", mods = "Command|Shift", action = "ReceiveChar" },
  { key = "K", mods = "Command|Shift", action = "ReceiveChar" },
  { key = "L", mods = "Command|Shift", action = "ReceiveChar" },
  { key = "P", mods = "Command", action = "ReceiveChar" },
  { key = "W", mods = "Command", action = "ReceiveChar" },
  { key = "D", mods = "Command", action = "ReceiveChar" },
  { key = "D", mods = "Command|Shift", action = "ReceiveChar" },
  { key = "1", mods = "Command", action = "ReceiveChar" },
  { key = "2", mods = "Command", action = "ReceiveChar" },
  { key = "3", mods = "Command", action = "ReceiveChar" },
  { key = "4", mods = "Command", action = "ReceiveChar" },
  { key = "5", mods = "Command", action = "ReceiveChar" },
  { key = "6", mods = "Command", action = "ReceiveChar" },
  { key = "7", mods = "Command", action = "ReceiveChar" },
  { key = "8", mods = "Command", action = "ReceiveChar" },
  { key = "9", mods = "Command", action = "ReceiveChar" },
]
