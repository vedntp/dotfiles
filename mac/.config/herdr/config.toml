onboarding = false

[keys]
prefix = "ctrl+b"
focus_agent = "ctrl+alt+1..9"
next_tab = ["prefix+n", "ctrl+tab"]
previous_tab = ["prefix+p", "ctrl+shift+tab"]
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+shift+n"
previous_agent = "alt+shift+tab"
next_agent = "alt+tab"
switch_tab = ["prefix+1..9", "cmd+1..9"]
goto = ["prefix+g", "cmd+p"]
focus_pane_left = ["prefix+h", "cmd+shift+h"]
focus_pane_down = ["prefix+j", "cmd+shift+j"]
focus_pane_up = ["prefix+k", "cmd+shift+k"]
focus_pane_right = ["prefix+l", "cmd+shift+l"]
new_tab = ["prefix+c", "cmd+t"]
rename_tab = ["prefix+shift+t", "cmd+shift+t"]
zoom = ["prefix+z", "cmd+z"]
close_pane = ["prefix+x", "cmd+w"]
split_vertical = ["prefix+v", "cmd+d"]
split_horizontal = ["prefix+minus", "cmd+shift+d"]
switch_workspace = "ctrl+1..9"

[ui]
agent_panel_sort = "spaces"
prompt_new_tab_name = false

show_agent_labels_on_pane_borders = true

# CPU and memory of the machine the focused space runs on. Herdr runs the
# command on that machine's server, so omarchy spaces show omarchy's load.
tab_bar_right = [
  { type = "command", command = "$HOME/.dotfiles/mac/.config/herdr/load-status", interval_seconds = 5, timeout_seconds = 5 },
]

[ui.toast]
# Herdr Focus Notify owns desktop notifications and click-to-focus behavior.
# Keep Herdr's own toast available inside the app without duplicating desktop
# notifications.
delivery = "herdr"

[ui.sound]
enabled = true
done_path = "/Users/vp/.config/opencode/sounds/conductor-chime.mp3"

# Sidebar rows, logos, and colours are documented in docs/herdr-sidebar.md.
# $harness_logo is "<glyph> <agent>", reported per pane by the agent-icons
# plugin (mac/.config/herdr/agent-icons). The glyphs need the JetBrains Mono
# Herdr XL font built by mac/.config/herdr/fonts/build-fonts.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "$harness_logo", fg = "#A8ADB9", bold = true, rules = [{ contains = " fx", fg = "#D6D6D6" }] }],
  [{ token = "$host_logo", fg = "#6B7089", dim = false, rules = [{ contains = "\uF303", fg = "#1793D1" }] }, "workspace", "tab"],
]

# Same row for every agent; only the logo colour differs.
[ui.sidebar.agents.rows_by_agent]
amp = [["state_icon", { token = "$harness_logo", fg = "#DFDFC1", bold = true, dim = false }], [{ token = "$host_logo", fg = "#6B7089", dim = false, rules = [{ contains = "\uF303", fg = "#1793D1" }] }, "workspace", "tab"]]
claude = [["state_icon", { token = "$harness_logo", fg = "#E68A67", bold = true, dim = false }], [{ token = "$host_logo", fg = "#6B7089", dim = false, rules = [{ contains = "\uF303", fg = "#1793D1" }] }, "workspace", "tab"]]
codex = [["state_icon", { token = "$harness_logo", fg = "#A78BFA", bold = true, dim = false }], [{ token = "$host_logo", fg = "#6B7089", dim = false, rules = [{ contains = "\uF303", fg = "#1793D1" }] }, "workspace", "tab"]]
opencode = [["state_icon", { token = "$harness_logo", fg = "#A8ADB9", bold = true, dim = false }], [{ token = "$host_logo", fg = "#6B7089", dim = false, rules = [{ contains = "\uF303", fg = "#1793D1" }] }, "workspace", "tab"]]
pi = [["state_icon", { token = "$harness_logo", fg = "#FFFFFF", bold = true, dim = false }], [{ token = "$host_logo", fg = "#6B7089", dim = false, rules = [{ contains = "\uF303", fg = "#1793D1" }] }, "workspace", "tab"]]

# $bte_logo is "<glyph> <label>" for every space, not only bte (the name is
# historical). The workspace-keepers plugin sets it from its config.json; the
# rules below colour the whole token by the label it contains.
[ui.sidebar.spaces]
rows = [["state_icon", { token = "$bte_logo", fg = "#A8ADB9", bold = true, dim = false, rules = [{ contains = "bte", fg = "#00D2BE" }, { contains = "stryde", fg = "#3B82F6" }, { contains = "vqa", fg = "#00B8F2" }] }], ["branch", "git_status"]]
