onboarding = false

[keys]
prefix = "ctrl+b"
focus_agent = "ctrl+alt+1..9"
next_tab = ["prefix+n", "ctrl+tab"]
previous_tab = ["prefix+p", "ctrl+shift+tab"]
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+shift+n"
# Patched build (next-machine.patch): first space of the next machine.
next_machine = "prefix+m"
previous_agent = "alt+shift+tab"
next_agent = "alt+tab"
switch_tab = ["prefix+1..9", "cmd+1..9"]
goto = ["prefix+g", "cmd+p"]
focus_pane_left = ["prefix+h", "cmd+shift+h"]
focus_pane_down = ["prefix+j", "cmd+shift+j"]
focus_pane_up = ["prefix+k", "cmd+shift+k"]
focus_pane_right = ["prefix+l", "cmd+shift+l"]
new_tab = ["prefix+c", "cmd+t"]
rename_tab = ["prefix+shift+t", "cmd+shift+t"]
zoom = ["prefix+z", "cmd+z"]
close_pane = ["prefix+x", "cmd+w"]
split_vertical = ["prefix+v", "cmd+d"]
split_horizontal = ["prefix+minus", "cmd+shift+d"]
switch_workspace = "ctrl+1..9"

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false

show_agent_labels_on_pane_borders = true

[ui.toast]
# Herdr Focus Notify owns desktop notifications and click-to-focus behavior.
# Keep Herdr's own toast available inside the app without duplicating desktop
# notifications.
delivery = "herdr"

[ui.sound]
enabled = true
done_path = "/Users/vp/.config/opencode/sounds/conductor-chime.mp3"

# Sidebar rows, logos, and colours are documented in docs/herdr-sidebar.md.
# Each agent is two lines: its chat title, then host, agent logo and space.
# $state_bar runs down the left of both lines in the agent's state colour. The
# tokens come from the agent-icons plugin (mac/.config/herdr/agent-icons), and
# the logos need the JetBrains Mono Herdr XL font from fonts/build-fonts.
# The bar's state is a zero-width marker after it: U+200B blocked, U+2060
# done, U+FEFF working, none for idle.
[ui.sidebar.agents]
row_gap = 0
rows = [[{ token = "$state_bar", fg = "#3A3D45", rules = [{ contains = "\u200B", fg = "#F06A64" }, { contains = "\u2060", fg = "#63C08A" }, { contains = "\uFEFF", fg = "#E8B04B" }] }, { token = "terminal_title_stripped", fg = "#D9DCE4", bold = false, dim = false }], [{ token = "$state_bar", fg = "#3A3D45", rules = [{ contains = "\u200B", fg = "#F06A64" }, { contains = "\u2060", fg = "#63C08A" }, { contains = "\uFEFF", fg = "#E8B04B" }] }, { token = "$host_logo", fg = "#6B7089", dim = false, rules = [{ contains = "\uE1B0", fg = "#FFFFFF" }, { contains = "\uE1B1", fg = "#1793D1" }] }, { token = "$harness_logo", fg = "#A8ADB9", bold = true, dim = false }, { token = "workspace", fg = "#50545F", bold = false, dim = false }]]

# Same rows for every agent; only the logo colour differs.
[ui.sidebar.agents.rows_by_agent]
amp = [[{ token = "$state_bar", fg = "#3A3D45", rules = [{ contains = "\u200B", fg = "#F06A64" }, { contains = "\u2060", fg = "#63C08A" }, { contains = "\uFEFF", fg = "#E8B04B" }] }, { token = "terminal_title_stripped", fg = "#D9DCE4", bold = false, dim = false }], [{ token = "$state_bar", fg = "#3A3D45", rules = [{ contains = "\u200B", fg = "#F06A64" }, { contains = "\u2060", fg = "#63C08A" }, { contains = "\uFEFF", fg = "#E8B04B" }] }, { token = "$host_logo", fg = "#6B7089", dim = false, rules = [{ contains = "\uE1B0", fg = "#FFFFFF" }, { contains = "\uE1B1", fg = "#1793D1" }] }, { token = "$harness_logo", fg = "#DFDFC1", bold = true, dim = false }, { token = "workspace", fg = "#50545F", bold = false, dim = false }]]
claude = [[{ token = "$state_bar", fg = "#3A3D45", rules = [{ contains = "\u200B", fg = "#F06A64" }, { contains = "\u2060", fg = "#63C08A" }, { contains = "\uFEFF", fg = "#E8B04B" }] }, { token = "terminal_title_stripped", fg = "#D9DCE4", bold = false, dim = false }], [{ token = "$state_bar", fg = "#3A3D45", rules = [{ contains = "\u200B", fg = "#F06A64" }, { contains = "\u2060", fg = "#63C08A" }, { contains = "\uFEFF", fg = "#E8B04B" }] }, { token = "$host_logo", fg = "#6B7089", dim = false, rules = [{ contains = "\uE1B0", fg = "#FFFFFF" }, { contains = "\uE1B1", fg = "#1793D1" }] }, { token = "$harness_logo", fg = "#E68A67", bold = true, dim = false }, { token = "workspace", fg = "#50545F", bold = false, dim = false }]]
codex = [[{ token = "$state_bar", fg = "#3A3D45", rules = [{ contains = "\u200B", fg = "#F06A64" }, { contains = "\u2060", fg = "#63C08A" }, { contains = "\uFEFF", fg = "#E8B04B" }] }, { token = "terminal_title_stripped", fg = "#D9DCE4", bold = false, dim = false }], [{ token = "$state_bar", fg = "#3A3D45", rules = [{ contains = "\u200B", fg = "#F06A64" }, { contains = "\u2060", fg = "#63C08A" }, { contains = "\uFEFF", fg = "#E8B04B" }] }, { token = "$host_logo", fg = "#6B7089", dim = false, rules = [{ contains = "\uE1B0", fg = "#FFFFFF" }, { contains = "\uE1B1", fg = "#1793D1" }] }, { token = "$harness_logo", fg = "#A78BFA", bold = true, dim = false }, { token = "workspace", fg = "#50545F", bold = false, dim = false }]]
opencode = [[{ token = "$state_bar", fg = "#3A3D45", rules = [{ contains = "\u200B", fg = "#F06A64" }, { contains = "\u2060", fg = "#63C08A" }, { contains = "\uFEFF", fg = "#E8B04B" }] }, { token = "terminal_title_stripped", fg = "#D9DCE4", bold = false, dim = false }], [{ token = "$state_bar", fg = "#3A3D45", rules = [{ contains = "\u200B", fg = "#F06A64" }, { contains = "\u2060", fg = "#63C08A" }, { contains = "\uFEFF", fg = "#E8B04B" }] }, { token = "$host_logo", fg = "#6B7089", dim = false, rules = [{ contains = "\uE1B0", fg = "#FFFFFF" }, { contains = "\uE1B1", fg = "#1793D1" }] }, { token = "$harness_logo", fg = "#A8ADB9", bold = true, dim = false }, { token = "workspace", fg = "#50545F", bold = false, dim = false }]]
pi = [[{ token = "$state_bar", fg = "#3A3D45", rules = [{ contains = "\u200B", fg = "#F06A64" }, { contains = "\u2060", fg = "#63C08A" }, { contains = "\uFEFF", fg = "#E8B04B" }] }, { token = "terminal_title_stripped", fg = "#D9DCE4", bold = false, dim = false }], [{ token = "$state_bar", fg = "#3A3D45", rules = [{ contains = "\u200B", fg = "#F06A64" }, { contains = "\u2060", fg = "#63C08A" }, { contains = "\uFEFF", fg = "#E8B04B" }] }, { token = "$host_logo", fg = "#6B7089", dim = false, rules = [{ contains = "\uE1B0", fg = "#FFFFFF" }, { contains = "\uE1B1", fg = "#1793D1" }] }, { token = "$harness_logo", fg = "#FFFFFF", bold = true, dim = false }, { token = "workspace", fg = "#50545F", bold = false, dim = false }]]

# One line per space: $space_bar in its agents' rolled-up state (same markers
# as $state_bar, set by agent-icons), the name, then $space_logo from the
# workspace-keepers plugin's config.json, coloured by the glyph it contains.
[ui.sidebar.spaces]
rows = [[{ token = "$space_bar", fg = "#3A3D45", rules = [{ contains = "\u200B", fg = "#F06A64" }, { contains = "\u2060", fg = "#63C08A" }, { contains = "\uFEFF", fg = "#E8B04B" }] }, "workspace", { token = "$space_logo", fg = "#A8ADB9", rules = [{ contains = "\uE1AC", fg = "#00D2BE" }, { contains = "\uE1AD", fg = "#3B82F6" }, { contains = "\uE1AE", fg = "#00B8F2" }] }]]

[terminal]
# New panes, tabs and spaces start in ~ instead of following the focused
# pane's directory (the default, "follow").
new_cwd = "home"
